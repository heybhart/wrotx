<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--SEO_HEAD-->
    <meta name="keywords" content="website development Mumbai, custom software development Mumbai, AI agent development India, WhatsApp automation India, web design Mumbai, AI calling agents Mumbai, GST invoicing software" />

    <!-- Google Search Console Verification (TODO: Replace with your actual GSC verification token) -->
    <meta name="google-site-verification" content="TODO_GOOGLE_SEARCH_CONSOLE_VERIFICATION_KEY" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Inline script for instant theme restore (prevents theme flashing) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('wrotx_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Immediate FOUC prevention & no-JS crawler visibility */
      html, body {
        background-color: #FFFFFF;
        color: #0F172A;
        margin: 0;
        padding: 0;
      }
      html.dark, html.dark body {
        background-color: #090D16;
        color: #F8FAFC;
      }
      @media (scripting: none) {
        .fade-up {
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body class="bg-white dark:bg-[#090D16] text-[#0F172A] dark:text-[#F8FAFC] antialiased selection:bg-[#D9480F]/20 selection:text-[#D9480F] transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
